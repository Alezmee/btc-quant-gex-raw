name: Recolectar crudo GEX BTC (Deribit)

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guardar_crudo:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests pandas pyarrow

      - name: Correr guardar_crudo.py
        run: python guardar_crudo.py --max-instrumentos 100

      - name: Commitear snapshot crudo del dia
        run: |
          git config user.name "gex-raw-bot"
          git config user.email "gex-raw-bot@users.noreply.github.com"
          git add data/raw/
          git diff --cached --quiet && echo "Sin cambios para commitear" && exit 0
          git commit -m "Snapshot crudo $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
